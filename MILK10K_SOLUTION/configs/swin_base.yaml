# ── Model ─────────────────────────────────────────────────────────────────────
model_name:      "swin_base_patch4_window7_224"
pretrained:      true
num_classes:     11
drop_rate:       0.3
drop_path_rate:  0.3

# ── Input mode ─────────────────────────────────────────────────────────────────
# mode: single_image | dual_image
mode:       "dual_image"
image_type: "dermoscopy"    # dermoscopy | clinical
image_size: 224

# ── Metadata ───────────────────────────────────────────────────────────────────
use_metadata: false         # set true to use age/sex/skin_tone/site/MONET

# ── Column names (fixed for combined CSV — do not change) ──────────────────────
lesion_col:   "lesion_id"
clinical_col: "clinical_path"
derm_col:     "derm_path"

# ── Dual-branch (only when mode=dual_image) ────────────────────────────────────
dual_shared_weights: true

# ── Data paths ─────────────────────────────────────────────────────────────────
train_csv: "datasets/MILK10k/splits/train_fold0.csv"
val_csv:   "datasets/MILK10k/splits/val_fold0.csv"
test_csv:  "datasets/MILK10k/test/test_combined.csv"

# image_dir points to the folder containing <lesion_id>/<isic_id>.jpg
train_image_dir: "datasets/MILK10k/train/MILK10k_Training_Input"
test_image_dir:  "datasets/MILK10k/test/MILK10k_Test_Input"
# For training, image_dir is used by the pipeline:
image_dir: "datasets/MILK10k/train/MILK10k_Training_Input"

# ── Training ───────────────────────────────────────────────────────────────────
epochs:      30
batch_size:  32
num_workers: 4
seed:        42

# ── Optimizer ──────────────────────────────────────────────────────────────────
optimizer:      "adamw"
lr:             1.0e-4
weight_decay:   1.0e-2
layer_lr_decay: 0.1      # backbone lr = lr * 0.1, head lr = lr

# ── Scheduler ──────────────────────────────────────────────────────────────────
scheduler:     "cosine"
warmup_epochs: 2
eta_min:       1.0e-7

# ── AMP & gradient ─────────────────────────────────────────────────────────────
use_amp:   true
clip_grad: 1.0

# ── Loss ───────────────────────────────────────────────────────────────────────
# Available loss functions:
#   bce            — BCE + sigmoid (multi-label). Pair with use_pos_weight: true
#   focal          — Sigmoid Focal Loss (multi-label). Params: focal_alpha, focal_gamma
#   softmax_ce     — CrossEntropy + softmax (single-label). Pair with class_weight via auto-compute
#   focal_softmax  — Focal + softmax (single-label). Params: focal_gamma, label_smoothing
#   asl            — Asymmetric Loss (multi-label). Params: asl_gamma_neg/pos, asl_clip
loss_name:       "focal_softmax"
# BCE params (used when loss_name: bce)
use_pos_weight:  true
# Focal params (used when loss_name: focal | focal_softmax)
focal_alpha:     0.25
focal_gamma:     2.0
# Softmax CE / Focal-Softmax params
label_smoothing: 0.1
# ASL params (used when loss_name: asl)
asl_gamma_neg:   4.0
asl_gamma_pos:   0.0
asl_clip:        0.05

# ── Sampler ────────────────────────────────────────────────────────────────────
use_weighted_sampler: true
mixup_alpha:          0.2   # 0.0 = disabled

# ── Early stopping ─────────────────────────────────────────────────────────────
early_stopping_patience: 10

# ── Threshold ──────────────────────────────────────────────────────────────────
threshold: 0.5

# ── Output ─────────────────────────────────────────────────────────────────────
checkpoint_dir: "outputs/checkpoints"
output_dir:     "outputs/logs"
submission_dir: "outputs/submissions"

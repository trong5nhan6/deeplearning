# ── Model ──────────────────────────────────────────────────────────────────────
model_name:      "hycnn_trans_softmoe"
pretrained:      true
num_classes:     11
embed_dim:       768          # unified token dim (thay attn_dim trong XAttnRes)
num_heads:       8
window_size:     8
drop_rate:       0.1
drop_path_rate:  0.1

# ── SoftMoE ─────────────────────────────────────────────────────────────────────
# n_experts: số expert FFN (mặc định 4, match số stage)
# moe_expand: FFN expansion ratio trong mỗi expert (mặc định 4, như Transformer)
n_experts:   4
n_slots:     1     # slots per expert (p) — tổng slots = n_experts * n_slots
moe_expand:  2

# ── Input mode ─────────────────────────────────────────────────────────────────
# mode: single_image | dual_image
#   single_image → một ảnh đi vào cả 2 branch (ConvNeXt + SwinV2)
#   dual_image   → derm → ConvNeXt-S,  clinical → SwinV2-S
mode:       "dual_image"
image_type: "dermoscopy"    # chỉ dùng khi mode=single_image
image_size: 256

# ── Metadata ───────────────────────────────────────────────────────────────────
# use_metadata=true  → tabular token được append vào SoftMoE sequence (token thứ 5)
# use_metadata=false → dùng learnable fixed token (như CLS token)
#
# KHÔNG có meta_dim ở đây — tính tự động từ MetadataProcessor.meta_dim sau .fit()
use_metadata:   true
meta_hidden:    256

# ── Column names ───────────────────────────────────────────────────────────────
lesion_col:   "lesion_id"
clinical_col: "clinical_path"
derm_col:     "derm_path"

# ── Data paths ─────────────────────────────────────────────────────────────────
train_csv:       "datasets/MILK10k/splits/train_fold0.csv"
val_csv:         "datasets/MILK10k/splits/val_fold0.csv"
test_csv:        "datasets/MILK10k/test/test_combined.csv"
train_image_dir: "datasets/MILK10k/train/MILK10k_Training_Input"
test_image_dir:  "datasets/MILK10k/test/MILK10k_Test_Input"

# ── Training ───────────────────────────────────────────────────────────────────
epochs:      30
batch_size:  16             # dual encoder + cross-attn + SoftMoE — giữ nhỏ
num_workers: 4
seed:        42

# ── Optimizer ──────────────────────────────────────────────────────────────────
optimizer:    "adamw"
lr:           3.0e-5
weight_decay: 1.0e-4

# ── Scheduler ──────────────────────────────────────────────────────────────────
scheduler:     "cosine"
warmup_epochs: 3
eta_min:       1.0e-7

# ── AMP & gradient ─────────────────────────────────────────────────────────────
use_amp:   true
clip_grad: 1.0

# ── Loss ───────────────────────────────────────────────────────────────────────
# Options:
#   focal_softmax      → class-weighted focal (baseline)
#   logit_adjustment   → LA loss (Menon 2021), requires la_tau
#   ldam               → LDAM loss (Cao 2019), can combine with DRW
#   ldam_drw           → LDAM + deferred re-weighting
loss_name:       "logit_adjustment"
label_smoothing: 0.1

# Logit Adjustment params
la_tau:          1.0

# LDAM params (dùng khi loss_name = ldam / ldam_drw)
ldam_c:          0.5
drw_start:       10

# Class weight params (dùng khi loss cần class_weight)
class_weight_mode: "effective"
class_weight_clip: 50.0
class_weight_beta: 0.9999

# ── Sampler ────────────────────────────────────────────────────────────────────
use_weighted_sampler: true

# ── BCL (Balanced Contrastive Learning) — Zhu et al. CVPR 2022 ───────────────
use_bcl:             false   # set true to enable contrastive training
bcl_feat_in_dim:     768    # embed_dim của SoftMoE
bcl_proj_hidden:     256
bcl_proj_dim:        128
bcl_temperature:     0.07
bcl_lambda_sup:      0.1
bcl_lambda_proto:    0.1
bcl_proto_momentum:  0.9

# ── cRT (Classifier Re-Training) — Kang et al. ICLR 2020 ──────────────────────
# Stage 2 sau main training: freeze backbone, retrain classifier với balanced sampler
use_crt:          true
crt_epochs:       12
crt_lr:           5.0e-5
crt_batch_size:   32

# ── Early stopping ─────────────────────────────────────────────────────────────
early_stopping_patience: 10

# ── Threshold ──────────────────────────────────────────────────────────────────
threshold: 0.5

# ── Output ─────────────────────────────────────────────────────────────────────
checkpoint_dir: "outputs/checkpoints"
output_dir:     "outputs/logs"
submission_dir: "outputs/submissions"

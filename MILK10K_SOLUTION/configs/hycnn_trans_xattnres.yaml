# ── Model ──────────────────────────────────────────────────────────────────────
model_name:      "hycnn_trans_xattnres"
pretrained:      true
num_classes:     11
attn_dim:        768
num_heads:       8
window_size:     8
drop_rate:       0.1
drop_path_rate:  0.1

# ── Input mode ─────────────────────────────────────────────────────────────────
# mode: single_image | dual_image
#   single_image → một ảnh đi vào cả 2 branch (ConvNeXt + SwinV2)
#   dual_image   → derm → ConvNeXt-S,  clinical → SwinV2-S
mode:       "dual_image"
image_type: "dermoscopy"    # chỉ dùng khi mode=single_image (dermoscopy | clinical)
image_size: 256

# ── Metadata ───────────────────────────────────────────────────────────────────
# use_metadata=true  → metadata của bệnh nhân làm pseudo-query trong AttnRes
# use_metadata=false → fixed learnable pseudo-query (như paper gốc XAttnRes)
#
# KHÔNG có meta_dim ở đây — được tính tự động từ MetadataProcessor.meta_dim
# sau khi .fit() trên train set (thường = 28: 3 + 11 sites + 14 MONET)
use_metadata:   false
meta_hidden:    256         # hidden dim của metadata MLP (architecture choice)

# ── Column names ───────────────────────────────────────────────────────────────
lesion_col:   "lesion_id"
clinical_col: "clinical_path"
derm_col:     "derm_path"

# ── Data paths ─────────────────────────────────────────────────────────────────
train_csv:       "datasets/MILK10k/splits/train_fold0.csv"
val_csv:         "datasets/MILK10k/splits/val_fold0.csv"
test_csv:        "datasets/MILK10k/test/test_combined.csv"
train_image_dir: "datasets/MILK10k/train/MILK10k_Training_Input"
test_image_dir:  "datasets/MILK10k/test/MILK10k_Test_Input"
image_dir: "datasets/MILK10k/train/MILK10k_Training_Input"

# ── Training ───────────────────────────────────────────────────────────────────
epochs:      40
batch_size:  16             # nhỏ hơn các model khác vì dual encoder + cross-attn
num_workers: 4
seed:        42

# ── Optimizer ──────────────────────────────────────────────────────────────────
optimizer:    "adamw"
lr:           3.0e-5        # lr nhỏ hơn vì model lớn hơn
weight_decay: 1.0e-4

# ── Scheduler ──────────────────────────────────────────────────────────────────
scheduler:     "cosine"
warmup_epochs: 3
eta_min:       1.0e-7

# ── AMP & gradient ─────────────────────────────────────────────────────────────
use_amp:   true
clip_grad: 1.0

# ── Loss ───────────────────────────────────────────────────────────────────────
# Options:
#   focal_softmax      → class-weighted focal (baseline)
#   logit_adjustment   → LA loss (Menon 2021), requires la_tau
#   ldam               → LDAM loss (Cao 2019), can combine with DRW via scheduler
#   ldam_drw           → LDAM + deferred re-weighting (turn on class_weight at epoch drw_start)
loss_name:       "logit_adjustment"
label_smoothing: 0.1

# Logit Adjustment params
la_tau:          0.5          # τ: scale factor for log-prior adjustment
                              # 1.0 = full adjustment (overcorrects at IR=280×)
                              # 0.5 = partial adjustment (more stable empirically)

# Per-sample loss clamp — ngăn sample outlier/mislabeled dominate training
# max CE cho 11 class = log(11) ≈ 2.4; clamp=4.0 cho 65% headroom trước khi clip
# 0.0 = tắt (không clamp)
loss_clamp:      4.0

# LDAM params (dùng khi loss_name = ldam / ldam_drw)
ldam_c:          0.5          # C trong margin = C / n_k^(1/4)
drw_start:       10           # epoch bắt đầu deferred re-weighting (chỉ dùng ldam_drw)

# Class weight params (dùng khi loss cần class_weight: focal_softmax, ldam, ldam_drw)
class_weight_mode: "effective"   # effective | inv_sqrt | inv_freq
class_weight_clip: 10.0       # giảm từ 50 → 10: tránh gradient explosion cho MAL_OTH
class_weight_beta: 0.9999
# weight_clamp: torch.clamp(weights, max=weight_clamp) bên trong forward() của mỗi loss
# Đây là safety net thứ 2 sau class_weight_clip (numpy-level).
# 0.0 = tắt; 3.0 = minority class đóng góp tối đa 3× majority (conservative)
weight_clamp:      3.0

# ── Sampler ────────────────────────────────────────────────────────────────────
use_weighted_sampler: true

# ── BCL (Balanced Contrastive Learning) — Zhu et al. CVPR 2022 ───────────────
# L_total = L_CE + λ_sup · L_SupCon + λ_proto · L_proto
#
# use_bcl: true  → kích hoạt projection head + SupCon + Prototype loss
# bcl_feat_in_dim: chiều feature trước head (= attn_dim cho HyCNN-Trans)
# bcl_proj_hidden: hidden dim của projection MLP
# bcl_proj_dim   : output dim của projection head (contrastive space)
# bcl_temperature: τ cho cosine similarity (0.07 = default SupCon)
# bcl_lambda_sup : trọng số L_SupCon (0.1 = bắt đầu nhẹ)
# bcl_lambda_proto: trọng số L_proto (0.1 = bắt đầu nhẹ)
# bcl_proto_momentum: EMA momentum cho prototype update (0.9)
# bcl_proj_lr    : lr của proj_head optimizer (mặc định = lr)
use_bcl:             true
bcl_feat_in_dim:     768    # = attn_dim của HyCNN-Trans
bcl_proj_hidden:     256
bcl_proj_dim:        128
bcl_temperature:     0.07
bcl_lambda_sup:      0.2
bcl_lambda_proto:    0.3
bcl_proto_momentum:  0.9
bcl_proj_lr:         3.0e-5
# Weighted SupCon: weight mỗi anchor theo 1/π_k (minority class được tính nhiều hơn)
# false = SupCon chuẩn; true = WeightedSupCon (khuyến nghị khi IR > 100×)
bcl_weighted_supcon: true
# weight_clamp cho WeightedSupConLoss:
#   weights = 1 / pi_k          → inverse class freq
#   weights = weights / mean     → normalize mean=1
#   weights = clamp(weights, max=bcl_supcon_weight_clamp)
# 3.0 = MAL_OTH anchor đóng góp tối đa 3× BCC (conservative, stable)
bcl_supcon_weight_clamp: 3.0

# ── Queue-based contrastive (BPaCo-style) ─────────────────────────────────────
# MoCo-style FIFO queue so minority classes (MAL_OTH=8 samples) are always
# represented in SupCon denominator, regardless of batch content.
# With batch=16 → queue fills in 4096/16=256 steps ≈ 0.8 epochs.
# 0 = disabled; 4096 = recommended
bcl_queue_size:      4096

# ── Feature-space augmentation for minority classes ────────────────────────────
# Generate virtual features: z_aug = α·z_real + (1-α)·proto + ε
# Only active after feat_aug_warmup epochs (prototype must be stable).
# Virtual features injected into SupConLoss only (not CE or PrototypeLoss).
# Classes with n_k ≤ minority_thresh samples are augmented.
# With per_sample=4 and 8 MAL_OTH real → 32 virtual → 40 total positives.
bcl_feat_aug:                 true
bcl_feat_aug_warmup:          5       # epochs to wait before augmenting
bcl_feat_aug_minority_thresh: 100     # n_k threshold (captures MAL_OTH=8, BEN_OTH, INF...)
bcl_feat_aug_per_sample:      4       # virtual features per real sample per class
bcl_feat_aug_alpha_min:       0.3     # interpolation range toward prototype
bcl_feat_aug_alpha_max:       0.7
bcl_feat_aug_noise_std:       0.05   # Gaussian noise std (unit sphere perturbation)

# ── cRT (Classifier Re-Training) — Kang et al. ICLR 2020 ──────────────────────
# Stage 1: train bình thường (code chạy đến đây như cũ)
# Stage 2: freeze backbone, retrain classifier với class-balanced sampler
#
# use_crt: true  → kích hoạt stage 2 sau khi stage 1 kết thúc
# crt_epochs    : số epoch stage 2 (10-15 là đủ vì chỉ train head)
# crt_lr        : lr nhỏ hơn stage 1 (head đã có feature tốt, chỉ cần fine-tune boundary)
# crt_batch_size: batch cho stage 2 (có thể tăng vì không cần full forward qua backbone)
use_crt:          false
crt_epochs:       12
crt_lr:           5.0e-5
crt_batch_size:   32

# ── Early stopping ─────────────────────────────────────────────────────────────
early_stopping_patience: 10

# ── Threshold ──────────────────────────────────────────────────────────────────
threshold: 0.5

# ── Output ─────────────────────────────────────────────────────────────────────
checkpoint_dir: "outputs/checkpoints"
output_dir:     "outputs/logs"
submission_dir: "outputs/submissions"

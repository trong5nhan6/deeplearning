# ── Model ──────────────────────────────────────────────────────────────────────
model_name:      "hycnn_trans_xattnres"
pretrained:      true
num_classes:     11
attn_dim:        768
num_heads:       8
window_size:     8
drop_rate:       0.1
drop_path_rate:  0.1

# ── Input mode ─────────────────────────────────────────────────────────────────
# mode: single_image | dual_image
#   single_image → một ảnh đi vào cả 2 branch (ConvNeXt + SwinV2)
#   dual_image   → derm → ConvNeXt-S,  clinical → SwinV2-S
mode:       "dual_image"
image_type: "dermoscopy"    # chỉ dùng khi mode=single_image (dermoscopy | clinical)
image_size: 256

# ── Metadata ───────────────────────────────────────────────────────────────────
# use_metadata=true  → metadata của bệnh nhân làm pseudo-query trong AttnRes
# use_metadata=false → fixed learnable pseudo-query (như paper gốc XAttnRes)
#
# KHÔNG có meta_dim ở đây — được tính tự động từ MetadataProcessor.meta_dim
# sau khi .fit() trên train set (thường = 28: 3 + 11 sites + 14 MONET)
use_metadata:   true
meta_hidden:    256         # hidden dim của metadata MLP (architecture choice)

# ── Column names ───────────────────────────────────────────────────────────────
lesion_col:   "lesion_id"
clinical_col: "clinical_path"
derm_col:     "derm_path"

# ── Data paths ─────────────────────────────────────────────────────────────────
train_csv:       "datasets/MILK10k/splits/train_fold0.csv"
val_csv:         "datasets/MILK10k/splits/val_fold0.csv"
test_csv:        "datasets/MILK10k/test/test_combined.csv"
train_image_dir: "datasets/MILK10k/train/MILK10k_Training_Input"
test_image_dir:  "datasets/MILK10k/test/MILK10k_Test_Input"

# ── Training ───────────────────────────────────────────────────────────────────
epochs:      30
batch_size:  16             # nhỏ hơn các model khác vì dual encoder + cross-attn
num_workers: 4
seed:        42

# ── Optimizer ──────────────────────────────────────────────────────────────────
optimizer:    "adamw"
lr:           3.0e-5        # lr nhỏ hơn vì model lớn hơn
weight_decay: 1.0e-4

# ── Scheduler ──────────────────────────────────────────────────────────────────
scheduler:     "cosine"
warmup_epochs: 3
eta_min:       1.0e-7

# ── AMP & gradient ─────────────────────────────────────────────────────────────
use_amp:   true
clip_grad: 1.0

# ── Loss ───────────────────────────────────────────────────────────────────────
loss_name:       "focal_softmax"
focal_gamma:     2.0
label_smoothing: 0.0

# ── Sampler ────────────────────────────────────────────────────────────────────
use_weighted_sampler: false

# ── Early stopping ─────────────────────────────────────────────────────────────
early_stopping_patience: 10

# ── Threshold ──────────────────────────────────────────────────────────────────
threshold: 0.5

# ── Output ─────────────────────────────────────────────────────────────────────
checkpoint_dir: "outputs/checkpoints"
output_dir:     "outputs/logs"
submission_dir: "outputs/submissions"
